services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: must-badminton-py-mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-badminton1}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: must-badminton-py-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_TYPE: mysql
      DB_NAME: ${MYSQL_DATABASE:-badminton1}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_NAME: ${APP_NAME:-Sports Club Manager}
      ORG_NAME: ${ORG_NAME:-My Sports Club}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-}
      PORT: 8081
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped

  client:
    build:
      context: ./client-front-end
      dockerfile: Dockerfile
    container_name: must-badminton-py-client
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

  admin:
    build:
      context: ./admin-front-end
      dockerfile: Dockerfile
    container_name: must-badminton-py-admin
    depends_on:
      - backend
    ports:
      - "8082:80"
    restart: unless-stopped

volumes:
  mysql_data:
